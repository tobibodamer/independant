name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build release APK & publish GitHub release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle (with caching)
        uses: gradle/actions/setup-gradle@v4

      # Decode the signing keystore from repo secrets and hand it to Gradle via
      # PENDANT_* properties (see app/build.gradle.kts). Without secrets the
      # APK is simply built unsigned, matching local behavior.
      - name: Decode signing keystore
        id: keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          echo "path=$RUNNER_TEMP/release.keystore" >> "$GITHUB_OUTPUT"

      - name: Build release APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          ARGS=(assembleRelease)
          if [[ -n "$ANDROID_KEYSTORE_BASE64" ]]; then
            ARGS+=(
              -PPENDANT_STORE_FILE="${{ steps.keystore.outputs.path }}"
              -PPENDANT_STORE_PASSWORD="$ANDROID_KEYSTORE_PASSWORD"
              -PPENDANT_KEY_ALIAS="$ANDROID_KEY_ALIAS"
              -PPENDANT_KEY_PASSWORD="$ANDROID_KEY_PASSWORD"
            )
          fi
          ./gradlew "${ARGS[@]}" --stacktrace

      - name: Collect APK
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mv app/build/outputs/apk/release/app-release*.apk "Pendant-$VERSION.apk"
          ls -la "Pendant-$VERSION.apk"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: Pendant-*.apk
          generate_release_notes: true
